name: kmovie
description: Ứng dụng xem phim Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  get: ^4.7.2
  shared_preferences: ^2.5.4
  video_player: ^2.9.5
  uuid: ^4.5.1
  wakelock_plus: ^1.4.0
  google_fonts: ^8.0.0
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/logo.png
    - assets/icons/logoapp.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logoapp.png"
  adaptive_icon_background: "#FF0000"
  adaptive_icon_foreground: "assets/icons/logoapp.png"
